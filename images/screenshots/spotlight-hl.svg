<svg viewBox="0 0 1600 1280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', sans-serif">
  <defs>
    <!-- Desktop wallpaper -->
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce7f6"/>
      <stop offset="0.5" stop-color="#e9f0e9"/>
      <stop offset="1" stop-color="#f4e8ee"/>
    </linearGradient>
    <filter id="blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <!-- Panel shadow -->
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="42" flood-color="#1b2a45" flood-opacity="0.28"/>
    </filter>
    <!-- App icon gradient -->
    <linearGradient id="appIcon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#3671e8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f7f8fb" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- Wallpaper -->
  <rect width="1600" height="1280" fill="url(#wall)"/>
  <g filter="url(#blob)">
    <circle cx="290" cy="230" r="300" fill="#8fb6f2" opacity="0.55"/>
    <circle cx="1380" cy="330" r="340" fill="#a9d4ae" opacity="0.5"/>
    <circle cx="1150" cy="1120" r="360" fill="#eeb3c4" opacity="0.5"/>
    <circle cx="330" cy="1080" r="300" fill="#b9c7ec" opacity="0.45"/>
  </g>

  <!-- Spotlight panel -->
  <g filter="url(#panelShadow)">
    <rect x="280" y="400" width="1040" height="470" rx="44" fill="url(#glass)"/>
    <rect x="280.5" y="400.5" width="1039" height="469" rx="43.5" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
    <rect x="281" y="401" width="1038" height="468" rx="43" fill="none" stroke="#1b2a45" stroke-opacity="0.08"/>
  </g>

  <!-- Query row -->
  <!-- App icon -->
  <rect x="322" y="438" width="72" height="72" rx="18" fill="url(#appIcon)"/>
  <!-- toolbox glyph -->
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="340" y="466" width="36" height="26" rx="5"/>
    <path d="M350 466 v-5 a8 8 0 0 1 8 -8 a8 8 0 0 1 8 8 v5"/>
    <path d="M340 478 h36"/>
  </g>

  <!-- Command text -->
  <text x="426" y="490" font-size="42" fill="#171c26" font-weight="500">Generate</text>
  <!-- MD5 parameter chip -->
  <rect x="628" y="452" width="118" height="56" rx="14" fill="#3671e8" fill-opacity="0.14"/>
  <text x="687" y="490" font-size="40" font-weight="600" fill="#2f66d8" text-anchor="middle">MD5</text>
  <text x="772" y="490" font-size="42" fill="#171c26" font-weight="500">hash of</text>
  <!-- input text + caret -->
  <text x="928" y="490" font-size="42" fill="#171c26" font-weight="500">aaa</text>
  <rect x="1004" y="456" width="3.5" height="50" rx="1.75" fill="#3671e8"/>
  <!-- return hint -->
  <text x="1278" y="488" font-size="30" fill="#9aa2b1" text-anchor="end">↩</text>

  <!-- Divider -->
  <line x1="322" y1="540" x2="1278" y2="540" stroke="#1b2a45" stroke-opacity="0.08"/>

  <!-- Result card -->
  <rect x="322" y="574" width="956" height="196" rx="24" fill="#f2f4f8"/>
  <text x="366" y="662" font-size="43" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#171c26" letter-spacing="0.5">47bce5c74f589f4867dbd57e9ca9f808</text>
  <!-- copied hint -->
  <g>
    <path d="M372 724 l9 9 l17 -18" stroke="#3f9e63" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="414" y="734" font-size="27" fill="#7c8494">Copied to clipboard</text>
  </g>
  <text x="1234" y="734" font-size="27" fill="#9aa2b1" text-anchor="end">DevUtilities</text>
</svg>
